name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner type
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - self-hosted
      build_mode:
        description: Brave build mode
        required: true
        default: extensions
        type: choice
        options:
          - baseline
          - extensions

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Bootstrap Brave and Chromium
        run: bash ./scripts/bootstrap.sh "$RUNNER_TEMP/brave-ext-work"
      - name: Verify overlay patches
        run: bash ./scripts/verify-patches.sh "$RUNNER_TEMP/brave-ext-work/src"
      - name: Apply overlay patches
        run: bash ./scripts/apply-patches.sh "$RUNNER_TEMP/brave-ext-work/src"
      - name: Build Android APK
        run: bash ./scripts/build-android.sh "$RUNNER_TEMP/brave-ext-work" "${{ inputs.build_mode }}"
      - name: Verify extension GN state
        if: ${{ inputs.build_mode == 'extensions' }}
        run: bash ./scripts/verify-extension-build.sh "$RUNNER_TEMP/brave-ext-work"
      - name: Collect build artifacts
        run: bash ./scripts/collect-artifacts.sh "$RUNNER_TEMP/brave-ext-work" artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: brave-android-${{ inputs.build_mode }}
          path: artifacts/
          if-no-files-found: error
